<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APA Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>Generador APA</h1>
        </header>

        <section class="card">
            <div class="form-group">
                <label>IA Generador</label>
                <select id="provider" disabled>
                    <option value="ollama" selected>Ollama 3 (Local)</option>
                    <option value="Gemini" disabled>Gemini (Online)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tema</label>
                <input type="text" id="topic" placeholder="Escribe el tema aquí..." autocomplete="off">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Páginas mín.</label>
                    <input type="number" id="minPages" value="1">
                </div>
                <div class="form-group">
                    <label>Páginas máx.</label>
                    <input type="number" id="maxPages" value="3">
                </div>
            </div>

            <button id="generateBtn">
                <span class="btn-text">Generar Informe</span>
                <div class="loader hidden"></div>
            </button>

            <div id="statusInfo" class="status-info hidden">
                <p><strong>Procesando...</strong></p>
                <p id="providerStatus"></p>
            </div>
        </section>

        <section id="resultSection" class="result-section hidden">
            <div class="result-header">
                <h2>Resultado</h2>
                <div class="actions">
                    <button id="downloadWord" class="btn-secondary">Word</button>
                    <button id="downloadPdf" class="btn-secondary">PDF</button>
                </div>
            </div>
            <div id="reportContent" class="report-box"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
